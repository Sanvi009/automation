<!DOCTYPE html>
<html>
<head>
    <title>Supabase Test</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        .result { padding: 20px; margin: 20px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Supabase Connection Test</h1>
    <button onclick="testSupabase()">Test Connection</button>
    <div id="result" class="result"></div>

    <script>
        async function testSupabase() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Testing...';
            
            try {
                const response = await fetch('/api/test');
                const data = await response.json();
                
                if (data.status === '✅ SUCCESS') {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h2>${data.status}</h2>
                        <p>${data.message}</p>
                        <p>Found ${data.count} videos</p>
                    `;
                } else {
                    result.className = 'result fail';
                    result.innerHTML = `
                        <h2>${data.status}</h2>
                        <p>${data.message}</p>
                        <p>SUPABASE_URL: ${data.url}</p>
                        <p>SUPABASE_ANON_KEY: ${data.key}</p>
                    `;
                }
            } catch (error) {
                result.className = 'result fail';
                result.innerHTML = `<h2>❌ Error</h2><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
